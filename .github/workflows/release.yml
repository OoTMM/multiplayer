name: Release Workflow

on:
  push:
    tags:
      - 'v*'
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.work

      - id: meta
        name: Extract metadata
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            short_sha="$(git rev-parse --short HEAD)"
            echo "version=dev-$short_sha" >> $GITHUB_OUTPUT
            echo "release_name=dev" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "release_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build binaries
        run: ./release.sh
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          working_directory: dist
          files: '*'
          tag_name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
